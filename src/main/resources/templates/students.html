<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <!-- Nhúng Bootstrap CSS để giao diện đẹp và nhanh hơn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Trang Quản Lý Danh Sách Sinh Viên</h2>

    <!-- Form thêm sinh viên mới -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Thêm Sinh Viên Mới</div>
        <div class="card-body">
            <form id="addStudentForm" onsubmit="addStudent(event)">
                <div class="row g-3">
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="studentCode" placeholder="Mã SV" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="fullName" placeholder="Họ và tên" required>
                    </div>
                    <div class="col-md-3">
                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="phone" placeholder="Số điện thoại">
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="className" placeholder="Lớp">
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3">Thêm Sinh Viên</button>
            </form>
        </div>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="input-group mb-3">
        <input type="text" id="keyword" class="form-control" placeholder="Nhập từ khóa tìm kiếm (Mã, Tên, Email, SĐT)...">
        <button class="btn btn-outline-secondary" type="button" onclick="loadStudents()">Tìm kiếm</button>
    </div>

    <!-- Bảng hiển thị danh sách sinh viên -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Mã SV</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Số Điện Thoại</th>
                <th>Lớp</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Dữ liệu sẽ được load tự động bằng JavaScript -->
        </tbody>
    </table>

    <!-- JavaScript xử lý gọi API -->
    <script>
        const API_URL = '/api/students';

        // 1. Hàm tải danh sách sinh viên (Hỗ trợ hiển thị tất cả & tìm kiếm)
        async function loadStudents() {
            const keyword = document.getElementById('keyword').value;
            let url = API_URL;
            if (keyword) {
                url += `?keyword=${encodeURIComponent(keyword)}`;
            }

            try {
                const response = await fetch(url);
                const students = await response.json();
                
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                students.forEach(student => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${student.studentCode}</td>
                            <td>${student.fullName}</td>
                            <td>${student.email}</td>
                            <td>${student.phone || ''}</td>
                            <td>${student.className || ''}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent('${student.id}')">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Lỗi khi tải dữ liệu:', error);
            }
        }

        // 2. Hàm thêm sinh viên mới (Gọi API POST)
        async function addStudent(event) {
            event.preventDefault();

            const studentData = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(studentData)
                });

                if (response.ok) {
                    document.getElementById('addStudentForm').reset();
                    loadStudents(); // Tải lại danh sách sau khi thêm thành công
                } else {
                    alert('Thêm sinh viên thất bại!');
                }
            } catch (error) {
                console.error('Lỗi khi thêm sinh viên:', error);
            }
        }

        // 3. Hàm xóa sinh viên theo ID (Gọi API DELETE)
        async function deleteStudent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        loadStudents(); // Tải lại danh sách sau khi xóa
                    } else {
                        alert('Xóa thất bại!');
                    }
                } catch (error) {
                    console.error('Lỗi khi xóa:', error);
                }
            }
        }

        // Tự động tải danh sách sinh viên ngay khi mở trang
        window.onload = loadStudents;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên - AdminLTE</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AdminLTE Style -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a href="#" class="nav-link">Hệ thống Quản lý Đào tạo</a>
            </li>
        </ul>
    </nav>
    <!-- /.navbar -->

    <!-- Main Sidebar Container -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="#" class="brand-link text-center">
            <span class="brand-text font-weight-bold">QUẢN LÝ SINH VIÊN</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a href="/admin/students" class="nav-link active">
                            <i class="nav-icon fas fa-users"></i>
                            <p>Danh sách sinh viên</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Phần C: Quản Lý Sinh Viên (AdminLTE)</h1>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                
                <!-- Form Thêm Mới Sinh Viên -->
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fas fa-user-plus"></i> Thêm Sinh Viên Mới</h3>
                    </div>
                    <div class="card-body">
                        <form id="addStudentForm">
                            <div class="row">
                                <div class="col-md-2">
                                    <div class="form-group">
                                        <input type="text" id="studentCode" class="form-control" placeholder="Mã SV" required>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <input type="text" id="fullName" class="form-control" placeholder="Họ và tên" required>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <input type="email" id="email" class="form-control" placeholder="Email" required>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <div class="form-group">
                                        <input type="text" id="phone" class="form-control" placeholder="Số điện thoại">
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <div class="form-group">
                                        <input type="text" id="className" class="form-control" placeholder="Lớp">
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Lưu Sinh Viên</button>
                        </form>
                    </div>
                </div>

                <!-- Tìm kiếm sinh viên -->
                <div class="input-group mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Nhập từ khóa tìm kiếm (Mã, Tên, Email, SĐT)...">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary" type="button" onclick="loadStudents()"><i class="fas fa-search"></i> Tìm kiếm</button>
                    </div>
                </div>

                <!-- Bảng Hiển Thị Dữ Liệu -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fas table-list"></i> Danh sách sinh viên từ Database</h3>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover text-nowrap">
                            <thead>
                                <tr>
                                    <th>Mã SV</th>
                                    <th>Họ và Tên</th>
                                    <th>Email</th>
                                    <th>Số điện thoại</th>
                                    <th>Lớp</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Dữ liệu được nạp tự động qua JavaScript từ REST API -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>
    </div>
</div>

<!-- REQUIRED SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    const API_URL = '/api/students';

    // 1. Lấy danh sách hoặc tìm kiếm sinh viên
    function loadStudents() {
        let keyword = document.getElementById('searchInput').value;
        let url = API_URL;
        if (keyword) {
            url += `?keyword=${encodeURIComponent(keyword)}`;
        }

        fetch(url)
            .then(response => response.json())
            .then(data => {
                let tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                data.forEach(student => {
                    let tr = `<tr>
                        <td><b>${student.studentCode || ''}</b></td>
                        <td>${student.fullName || ''}</td>
                        <td>${student.email || ''}</td>
                        <td>${student.phone || ''}</td>
                        <td><span class="badge badge-info">${student.className || ''}</span></td>
                        <td class="text-center">
                            <button class="btn btn-danger btn-sm" onclick="deleteStudent('${student.id}')">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += tr;
                });
            })
            .catch(error => console.error('Lỗi tải dữ liệu:', error));
    }

    // 2. Thêm mới sinh viên (POST API)
    document.getElementById('addStudentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let student = {
            studentCode: document.getElementById('studentCode').value,
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            className: document.getElementById('className').value
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        })
        .then(response => {
            if (response.ok) {
                alert('Thêm sinh viên thành công!');
                document.getElementById('addStudentForm').reset();
                loadStudents();
            } else {
                alert('Thêm sinh viên thất bại!');
            }
        })
        .catch(error => console.error('Lỗi:', error));
    });

    // 3. Xóa sinh viên (DELETE API)
    function deleteStudent(id) {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        alert('Xóa sinh viên thành công!');
                        loadStudents();
                    } else {
                        alert('Xóa thất bại!');
                    }
                })
                .catch(error => console.error('Lỗi:', error));
        }
    }

    // Tự động chạy hàm tải dữ liệu khi trang vừa mở
    window.onload = loadStudents;
</script>
</body>
</html>
